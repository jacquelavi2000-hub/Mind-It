<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d32"><title>Support · Mind-It</title><style>
:root{color-scheme:light;--forest:#183d32;--cream:#f4f1e8;--ink:#20372e;--muted:#718078;--line:#e5e8df}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink)}header{padding:20px max(20px,calc((100% - 900px)/2));background:#fffefa;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}header a{color:var(--forest);text-decoration:none;font-weight:700}.wrap{max-width:720px;margin:48px auto;padding:0 18px}.card{background:#fffefa;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 14px 40px rgba(24,61,50,.07)}h1{margin:0 0 8px;color:var(--forest);font-size:clamp(28px,5vw,38px)}.muted{color:var(--muted);line-height:1.6;margin:0 0 26px}.field{margin:18px 0}.field label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}.field input,.field textarea{width:100%;padding:13px 14px;border:1px solid #dce3da;border-radius:10px;background:white;font:inherit;color:var(--ink)}.field textarea{min-height:170px;resize:vertical}.btn{border:0;border-radius:10px;padding:13px 18px;background:var(--forest);color:white;font-weight:700;font:inherit;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:16px;padding:13px;border-radius:10px;line-height:1.5}.status.show{display:block}.success{background:#e7f1e8;color:#245b3c}.error{background:#fbe9e7;color:#913e37}.foot{font-size:12px;color:var(--muted);margin-top:20px}@media(max-width:600px){.wrap{margin:25px auto}}
</style></head><body><header><a href="index.html">Mind-It</a><a href="index.html">← Retour au site</a></header><main class="wrap"><section class="card"><h1>Comment pouvons-nous t'aider ?</h1><p class="muted">Décris ton problème et indique une adresse e-mail valide. L'équipe Mind-It pourra te répondre directement.</p><form id="supportForm"><div class="field"><label for="email">Ton adresse e-mail</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="toi@exemple.com" required></div><div class="field"><label for="subject">Sujet</label><input id="subject" name="subject" maxlength="120" placeholder="Ex. : Je n'arrive pas à ouvrir mon projet" required></div><div class="field"><label for="message">Décris ton problème</label><textarea id="message" name="message" minlength="10" maxlength="5000" placeholder="Explique ce qui se passe et ce que tu essayais de faire…" required></textarea></div><button class="btn" id="sendButton" type="submit">Envoyer ma demande</button><div class="status" id="formStatus" role="status" aria-live="polite"></div></form><p class="foot">Ton adresse e-mail sera utilisée uniquement pour répondre à ta demande.</p></section></main><script>
(()=>{const form=document.getElementById('supportForm'),button=document.getElementById('sendButton'),status=document.getElementById('formStatus');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;button.textContent='Envoi…';status.className='status';try{const response=await fetch('https://mind-it-server.onrender.com/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value,subject:form.subject.value,message:form.message.value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Envoi impossible.');status.textContent=data.message||'Demande envoyée.';status.className='status show success';form.reset();}catch(error){status.textContent=error.message;status.className='status show error';}finally{button.disabled=false;button.textContent='Envoyer ma demande';}});})();
</script></body></html>
