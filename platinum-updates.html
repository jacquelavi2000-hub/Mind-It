<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platinum Updates — Mind-It</title><style>:root{--cream:#f4f1e8;--green:#294735;--ink:#20372e;--muted:#66736a}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--cream);color:var(--ink);font:16px/1.6 system-ui,sans-serif}.card{max-width:720px;margin:7vh auto;padding:clamp(24px,5vw,44px);background:#fffefa;border:1px solid #e2e3d9;border-radius:22px}h1{color:var(--green)}.muted{color:var(--muted)}input,button{width:100%;padding:12px 14px;border-radius:10px;font:inherit}input{border:1px solid #e2e3d9;margin:8px 0 14px}button{border:0;background:var(--green);color:white;font-weight:650;cursor:pointer}.panel{margin-top:20px;padding:18px;background:#f0f2eb;border-radius:12px}.hidden{display:none}a{color:var(--green)}</style></head><body><main class="card"><b>Mind-It / Platinum</b><h1>Platinum Updates</h1><p class="muted">Entre ta clé pour vérifier ton abonnement et consulter les mises à jour.</p><form id="form"><label for="license">Clé de licence Platinum</label><input id="license" autocomplete="off" spellcheck="false" placeholder="MINDIT-XXXX-XXXX-…" required><button id="verify">Vérifier ma licence</button></form><p id="status" class="muted" role="status" aria-live="polite"></p><section id="panel" class="panel hidden"><h2 id="version"></h2><p id="notes"></p><button id="download">Télécharger la mise à jour</button></section><p><a href="index.html">← Retour à Mind-It</a></p></main><script>
const API="https://mind-it-server.onrender.com";let licenseKey="",version="";const status=document.getElementById("status");document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("verify");b.disabled=true;document.getElementById("panel").classList.add("hidden");status.textContent="Vérification…";licenseKey=document.getElementById("license").value.trim().toUpperCase();try{const r=await fetch(`${API}/api/platinum/validate-license`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({license_key:licenseKey})}),d=await r.json();if(!r.ok||!d.valid)throw Error(d.error||"Licence invalide.");const u=await fetch(`${API}/api/platinum/updates/latest`),v=await u.json();if(!u.ok)throw Error(v.error||"Aucune mise à jour disponible.");version=v.version;document.getElementById("version").textContent=`Version ${v.version}`;document.getElementById("notes").textContent=v.release_notes||"Mise à jour Mind-It.";document.getElementById("panel").classList.remove("hidden");status.textContent=d.cancel_at_period_end?"Accès conservé jusqu'à la fin de la période payée.":"Licence Platinum active.";}catch(e){status.textContent=e.message;}finally{b.disabled=false;}});
document.getElementById("download").addEventListener("click",async()=>{const b=document.getElementById("download");b.disabled=true;status.textContent="Préparation du téléchargement…";try{const r=await fetch(`${API}/api/platinum/update-download`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({license_key:licenseKey,version})}),d=await r.json();if(!r.ok||!d.download_url)throw Error(d.error||"Téléchargement indisponible.");const u=new URL(d.download_url);if(u.protocol!=="https:")throw Error("Lien invalide.");location.assign(u.href);status.textContent="Le téléchargement démarre…";}catch(e){status.textContent=e.message;}finally{b.disabled=false;}});
</script></body></html>
