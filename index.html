
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mind-It</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f1e8;
      color: #294735;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    main { max-width: 520px; width: 100%; }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: #294735;
      color: #f4f1e8;
      font-size: 36px;
      font-weight: bold;
    }

    h1 { font-size: 48px; margin: 0; }

    p {
      color: #69766b;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
      margin-top: 26px;
    }

    .button {
      display: block;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s, transform .2s;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .free {
      background: #294735;
      color: white;
      border: 2px solid #294735;
    }

    .free:hover { background: #42694d; }

    .premium {
      background: transparent;
      color: #294735;
      border: 2px solid #294735;
    }

    .premium:hover { background: #e8e5da; }

    #status {
      min-height: 24px;
      font-size: 14px;
    }

    footer {
      margin-top: 35px;
      color: #899187;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <div class="logo">M</div>

    <h1>Mind-It</h1>

    <p>
      Organise tes idées. Crée tes projets.<br>
      Tout commence ici.
    </p>

    <div class="buttons">
      <a
        class="button free"
        href="https://github.com/jacquelavi2000-hub/Mind-It/releases/download/2.1/Mind-It-FP.Setup.2.1.0.exe"
      >
        ↓ Télécharger gratuitement
      </a>

      <button
        class="button premium"
        id="buyButton"
        type="button"
      >
        ✦ Acheter la version Premium
      </button>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>Mind-It · Application Windows</footer>
  </main>

  <script>
    const buyButton = document.getElementById("buyButton");
    const status = document.getElementById("status");

    buyButton.addEventListener("click", async () => {
      buyButton.disabled = true;
      status.textContent = "Préparation du paiement…";

      try {
        const response = await fetch(
          "https://mind-it-server.onrender.com/api/create-checkout-session",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({})
          }
        );

        const data = await response.json();

        if (!response.ok || !data.url) {
          throw new Error("Paiement indisponible");
        }

        window.location.assign(data.url);
      } catch {
        status.textContent =
          "Le paiement n'est pas encore disponible.";
        buyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
