
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mind-It</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f1e8;
      color: #294735;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }

    main { max-width: 520px; }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: #294735;
      color: #f4f1e8;
      font-size: 36px;
      font-weight: bold;
    }

    h1 { font-size: 48px; margin: 0; }
    p { color: #69766b; line-height: 1.7; }

    button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #294735;
      color: white;
      border: 0;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { background: #42694d; }
    button:disabled { opacity: .6; cursor: wait; }

    footer { margin-top: 35px; color: #899187; font-size: 13px; }
    #status { min-height: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">M</div>
    <h1>Mind-It</h1>
    <p>
      Organise tes idées. Crée tes projets.<br>
      Tout commence ici.
    </p>

    <button id="buyButton" type="button">
      Acheter Mind-It
    </button>

    <p id="status" role="status" aria-live="polite"></p>

    <footer>Mind-It · Application Windows</footer>
  </main>

  <script>
    const buyButton = document.getElementById("buyButton");
    const status = document.getElementById("status");

    buyButton.addEventListener("click", async () => {
      buyButton.disabled = true;
      status.textContent = "Préparation du paiement…";

      try {
        const response = await fetch(
          "https://TON-SERVEUR.example.com/api/create-checkout-session",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({})
          }
        );

        const data = await response.json();

        if (!response.ok || !data.url) {
          throw new Error("Impossible de créer le paiement.");
        }

        window.location.assign(data.url);
      } catch (error) {
        status.textContent =
          "Le paiement est momentanément indisponible. Réessaie plus tard.";
        buyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
